name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt needed on:" && echo "$files" && exit 1
          fi

  # The service composition runs the engine inside the Windows service process;
  # dispatchCommand-level tests (geo assets crossing the IPC request) only
  # compile with the service+windows tags, so they need a Windows runner.
  service-windows:
    name: service (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Test
        run: go test -tags="service integration with_gvisor" ./internal/core/
        env:
          CGO_ENABLED: '0'

  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # amneziawg-go is a test-only peer: no composition links it.
          - name: full (xray+mihomo)
            tags: ''
            forbidden: 'github.com/amnezia-vpn'
          # Without mihomo nothing GPL links: no mihomo/sing (either fork) at all.
          - name: xray-only (no_mihomo)
            tags: 'no_mihomo'
            forbidden: 'github.com/metacubex|github.com/sagernet/sing|github.com/amnezia-vpn'
          - name: mihomo-only (no_xray)
            tags: 'no_xray'
            forbidden: 'github.com/xtls/xray-core|github.com/amnezia-vpn|github.com/xjasonlyu/tun2socks'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      # Dart SDK headers are needed to vet the root FFI shell (dart_api_dl.h).
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.4.3'

      - name: Vet
        run: |
          DART_SDK=$(dirname "$(dirname "$(which dart)")")
          CGO_CFLAGS="-I$DART_SDK/include" go vet -tags="${{ matrix.tags }} with_gvisor" ./ ./internal/...

      # The Makefile's release tags: what ships has to compile too.
      - name: Vet (release tags)
        run: |
          DART_SDK=$(dirname "$(dirname "$(which dart)")")
          CGO_CFLAGS="-I$DART_SDK/include" go vet -tags="${{ matrix.tags }} with_gvisor no_tailscale no_easytier no_zerotier" ./ ./internal/...

      - name: Test
        run: CGO_ENABLED=0 go test -tags="${{ matrix.tags }} with_gvisor" ./internal/...

      # -race needs cgo. The tests that run a live mihomo skip themselves
      # under it (internal/core/race_test.go).
      - name: Test (race detector)
        if: matrix.tags == ''
        run: CGO_ENABLED=1 go test -race -tags="with_gvisor" ./internal/...

      - name: License guard (excluded engines stay out of the link)
        if: matrix.forbidden != ''
        run: |
          count=$(CGO_ENABLED=0 go list -tags="${{ matrix.tags }} with_gvisor" -deps ./internal/core/ ./internal/pinger/ ./internal/linkrelay/ | grep -cE "${{ matrix.forbidden }}" || true)
          echo "forbidden packages linked: $count"
          [ "$count" = "0" ]
