name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt needed on:" && echo "$files" && exit 1
          fi

  # The licence texts of the modules the release links are committed; a
  # dependency bump that moves them has to move the file with it.
  notices:
    name: Go module notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - run: make notices-check

  # The service composition runs the engine inside the Windows service process;
  # dispatchCommand-level tests (geo assets crossing the IPC request) only
  # compile with the service+windows tags, so they need a Windows runner.
  service-windows:
    name: service (windows, ${{ matrix.layer }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - layer: main
            tags: ''
          - layer: tun2socks
            tags: 'with_tun2socks'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Test
        run: go test -tags="service integration with_gvisor ${{ matrix.tags }}" ./internal/core/
        env:
          CGO_ENABLED: '0'

  # Two variants, one TUN layer each: the main one (no tag, sing-tun) and the tun2socks
  # bridge (with_tun2socks). Every composition is built and tested in both.
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # amneziawg-go is a test-only peer: no composition links it. The main
          # variant links no tun2socks: sing-tun is its only TUN layer.
          - name: full (xray+mihomo), main
            tags: ''
            race: true
            forbidden: 'github.com/amnezia-vpn|github.com/xjasonlyu/tun2socks'
            mainVariant: true
          - name: full (xray+mihomo), tun2socks
            tags: 'with_tun2socks'
            race: true
            forbidden: 'github.com/amnezia-vpn'
          # Without mihomo no engine of its own links; the main variant's TUN
          # layer is sing-tun, so its GPL code is the one thing that stays.
          - name: xray-only (no_mihomo), main
            tags: 'no_mihomo'
            forbidden: 'github.com/metacubex/mihomo|github.com/sagernet/sing|github.com/amnezia-vpn|github.com/xjasonlyu/tun2socks'
            mainVariant: true
          # Without mihomo and on the bridge nothing GPL links: no mihomo/sing
          # (either fork) at all.
          - name: xray-only (no_mihomo), tun2socks
            tags: 'with_tun2socks no_mihomo'
            forbidden: 'github.com/metacubex|github.com/sagernet/sing|github.com/amnezia-vpn'
          # Without xray no tun2socks bridge links, in either variant: mihomo's
          # own TUN is the only layer.
          - name: mihomo-only (no_xray), main
            tags: 'no_xray'
            forbidden: 'github.com/xtls/xray-core|github.com/amnezia-vpn|github.com/xjasonlyu/tun2socks'
            wintunForbidden: 'golang.zx2c4.com/wintun'
            mainVariant: true
          - name: mihomo-only (no_xray), tun2socks
            tags: 'with_tun2socks no_xray'
            forbidden: 'github.com/xtls/xray-core|github.com/amnezia-vpn|github.com/xjasonlyu/tun2socks'
            wintunForbidden: 'golang.zx2c4.com/wintun'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      # Dart SDK headers are needed to vet the root FFI shell (dart_api_dl.h).
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.4.3'

      - name: Vet
        run: |
          DART_SDK=$(dirname "$(dirname "$(which dart)")")
          CGO_CFLAGS="-I$DART_SDK/include" go vet -tags="${{ matrix.tags }} with_gvisor" ./ ./internal/...

      # The Makefile's release tags: what ships has to compile too.
      - name: Vet (release tags)
        run: |
          DART_SDK=$(dirname "$(dirname "$(which dart)")")
          CGO_CFLAGS="-I$DART_SDK/include" go vet -tags="${{ matrix.tags }} with_gvisor no_tailscale no_easytier no_zerotier" ./ ./internal/...

      # The Windows-tagged files compile in every composition and variant.
      - name: Vet (windows target)
        run: GOOS=windows CGO_ENABLED=0 go vet -tags="${{ matrix.tags }} with_gvisor" ./internal/...

      - name: Test
        run: CGO_ENABLED=0 go test -tags="${{ matrix.tags }} with_gvisor" ./internal/...

      # -race needs cgo. The tests that run a live mihomo skip themselves
      # under it (internal/core/race_test.go).
      - name: Test (race detector)
        if: matrix.race
        run: CGO_ENABLED=1 go test -race -tags="${{ matrix.tags }} with_gvisor" ./internal/...

      - name: License guard (excluded engines stay out of the link)
        if: matrix.forbidden != ''
        run: |
          count=$(CGO_ENABLED=0 go list -tags="${{ matrix.tags }} with_gvisor" -deps ./internal/core/ ./internal/pinger/ ./internal/linkrelay/ | grep -cE "${{ matrix.forbidden }}" || true)
          echo "forbidden packages linked: $count"
          [ "$count" = "0" ]

      # Wintun has one binding per binary. Without xray the only TUN layer is
      # mihomo's sing-tun, which carries its own: the one tun2socks and xray's
      # WireGuard bring must not link beside it.
      - name: Wintun guard (windows target)
        if: matrix.wintunForbidden != ''
        run: |
          count=$(GOOS=windows CGO_ENABLED=0 go list -tags="${{ matrix.tags }} with_gvisor" -deps ./internal/core/ ./internal/pinger/ ./internal/linkrelay/ | grep -cE "${{ matrix.wintunForbidden }}" || true)
          echo "forbidden packages linked: $count"
          [ "$count" = "0" ]

      # The main variant links no tun2socks on any target, so no second
      # TUN layer and no bridge Wintun binding comes with it.
      - name: TUN layer guard (main variant, every target)
        if: matrix.mainVariant
        run: |
          for target in linux windows android; do
            count=$(GOOS=$target CGO_ENABLED=1 go list -tags="${{ matrix.tags }} with_gvisor" -deps ./internal/core/ ./internal/pinger/ ./internal/linkrelay/ | grep -c 'github.com/xjasonlyu/tun2socks' || true)
            echo "$target: tun2socks packages linked: $count"
            [ "$count" = "0" ]
          done

      # Only sing-tun's binding drives a Windows adapter in the main variant:
      # the built binary holds no tun2socks symbol. golang.zx2c4.com/wintun
      # stays linked through xray-core's TUN, WireGuard and masque packages;
      # TestXrayTun_NeverLoadsTheWintunLibraryOnDisk shows it is never loaded.
      - name: Wintun symbols (windows binary, main full)
        if: matrix.name == 'full (xray+mihomo), main'
        run: |
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
          DART_SDK=$(dirname "$(dirname "$(which dart)")")
          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc CGO_CFLAGS="-I$DART_SDK/include" \
            go build -buildvcs=false -tags="service with_gvisor no_tailscale no_easytier no_zerotier" -o core.exe ./
          go tool nm core.exe > symbols.txt
          tun2socks=$(grep -c 'tun2socks' symbols.txt || true)
          singtun=$(grep -c 'sing-tun/internal/wintun\.CreateAdapter' symbols.txt || true)
          echo "tun2socks symbols: $tun2socks, sing-tun's CreateAdapter: $singtun"
          [ "$tun2socks" = "0" ] && [ "$singtun" != "0" ]
